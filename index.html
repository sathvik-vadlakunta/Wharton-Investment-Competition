<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1117;color:#e1e4e8;min-height:100vh}
header{background:#161b22;border-bottom:1px solid #30363d;padding:20px 32px}
header h1{font-size:20px;font-weight:600;color:#f0f6fc}
header p{font-size:13px;color:#8b949e;margin-top:3px}
.main{max-width:1200px;margin:0 auto;padding:24px 32px}
.tabs{display:flex;gap:4px;margin-bottom:20px;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:4px;width:fit-content}
.tab{padding:8px 20px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:500;color:#8b949e;transition:all .15s;border:none;background:none}
.tab.active{background:#1f6feb;color:#fff}
.tab:hover:not(.active){color:#e1e4e8;background:#21262d}
.controls{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search-wrap{position:relative;flex:1;min-width:240px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#8b949e;pointer-events:none}
input[type=text]{width:100%;padding:9px 12px 9px 38px;background:#161b22;border:1px solid #30363d;border-radius:8px;color:#e1e4e8;font-size:14px;outline:none;transition:border-color .15s}
input[type=text]:focus{border-color:#1f6feb}
input[type=text]::placeholder{color:#484f58}
select{padding:9px 12px;background:#161b22;border:1px solid #30363d;border-radius:8px;color:#e1e4e8;font-size:14px;outline:none;cursor:pointer}
.count{font-size:13px;color:#8b949e;padding:8px 0}
.count span{color:#e1e4e8;font-weight:600}
.table-wrap{overflow-x:auto;border:1px solid #30363d;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{text-align:left;padding:10px 14px;color:#8b949e;font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #30363d;background:#161b22;position:sticky;top:0;z-index:1}
tbody tr{border-bottom:1px solid #21262d;cursor:pointer}
tbody tr:hover{background:#1c2128}
tbody td{padding:11px 14px;vertical-align:middle}
.ticker{font-family:monospace;font-weight:700;color:#58a6ff;font-size:13px}
.tag{display:inline-block;padding:2px 7px;background:#21262d;border-radius:4px;font-size:11px;color:#8b949e}
.badge-eq{background:#1c2d3b;color:#58a6ff;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:500}
.review-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#f0883e;margin-left:5px;vertical-align:middle;cursor:help}
.no-data{color:#484f58;font-style:italic}
.empty{text-align:center;padding:60px 0;color:#484f58}
/* Modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;align-items:center;justify-content:center;padding:24px}
.overlay.open{display:flex}
.modal{background:#161b22;border:1px solid #30363d;border-radius:12px;width:100%;max-width:860px;max-height:90vh;overflow-y:auto}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal-ticker{font-family:monospace;font-size:24px;font-weight:700;color:#58a6ff}
.modal-name{font-size:14px;color:#8b949e;margin-top:2px}
.modal-close{background:#21262d;border:1px solid #30363d;color:#e1e4e8;cursor:pointer;font-size:16px;padding:6px 12px;border-radius:6px;flex-shrink:0}
.modal-close:hover{background:#30363d}
.modal-body{padding:20px 24px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px}
.stat-card{background:#0f1117;border:1px solid #21262d;border-radius:8px;padding:12px 14px}
.stat-label{font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.stat-value{font-size:18px;font-weight:600;color:#e1e4e8}
.stat-value.pos{color:#3fb950}
.stat-value.neg{color:#f85149}
.range-btns{display:flex;gap:6px;margin-bottom:14px}
.range-btn{padding:5px 12px;background:#21262d;border:1px solid #30363d;border-radius:6px;color:#8b949e;font-size:12px;cursor:pointer}
.range-btn.active{background:#1f6feb;border-color:#1f6feb;color:#fff}
.chart-wrap{position:relative;height:260px;background:#0f1117;border-radius:8px;overflow:hidden}
.loading{display:flex;align-items:center;justify-content:center;height:260px;color:#484f58;font-size:14px}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:16px}
.meta-row{display:flex;justify-content:space-between;padding:7px 10px;background:#0f1117;border-radius:6px;font-size:13px}
.meta-row span:first-child{color:#8b949e}
.meta-row span:last-child{color:#e1e4e8;font-weight:500}
</style>
</head>

// Build lookup maps — avoids any JSON-in-HTML-attribute escaping issues
const SMETA = {}, EMETA = {};
DATA.stocks.forEach(s => { SMETA[s.ticker] = s; });
DATA.etfs.forEach(e => { EMETA[e.ticker] = e; });

let activeTab = 'stocks';
let chart = null;
let allPrices = [];
let currentRange = 365;

// ── Tab ──────────────────────────────────────────────────────────────────────
function switchTab(t) {
  activeTab = t;
  ['stocks','etfs','bonds'].forEach((x,i) => {
    document.getElementById('panel-'+x).style.display = x===t?'':'none';
    document.querySelectorAll('.tab')[i].classList.toggle('active', x===t);
  });
  if(t==='stocks') renderStocks();
  else if(t==='etfs') renderETFs();
  else renderBonds();
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function esc(s){ return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtP(p){ return p!=null?'$'+p.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—'; }
function fmtR(r){
  if(r==null) return '<span class="no-data">—</span>';
  return `<span style="color:${r>=0?'#3fb950':'#f85149'};font-weight:600">${r>=0?'+':''}${r.toFixed(1)}%</span>`;
}

// ── Stats cache ───────────────────────────────────────────────────────────────
const statsCache = {};
async function loadStats(ticker) {
  if(ticker in statsCache) return statsCache[ticker];
  try {
    const res = await fetch('data/prices/' + ticker + '.json');
    if(!res.ok) { statsCache[ticker]=null; return null; }
    const prices = await res.json();
    if(!prices||prices.length<5) { statsCache[ticker]=null; return null; }
    const last = prices[prices.length-1];
    const cutoff1y = new Date(Date.now()-365*86400000).toISOString().slice(0,10);
    const base = prices.find(p=>p.d>=cutoff1y)||prices[0];
    const ret = (last.c-base.c)/base.c*100;
    statsCache[ticker] = { price: last.c, ret, date: last.d };
  } catch(e) { statsCache[ticker] = null; }
  return statsCache[ticker];
}

async function preload(tickers) {
  await Promise.all(tickers.slice(0,50).map(t=>loadStats(t)));
  if(activeTab==='stocks') renderStocks(true);
  else if(activeTab==='etfs') renderETFs(true);
}

// ── Render stocks ─────────────────────────────────────────────────────────────
function renderStocks(skipPreload) {
  const q = document.getElementById('search-stocks').value.toLowerCase().trim();
  const sec = document.getElementById('filter-sector').value;
  const rows = DATA.stocks.filter(s =>
    (!sec||s.sector===sec) &&
    (!q||(s.ticker||'').toLowerCase().includes(q)||(s.name||'').toLowerCase().includes(q)||(s.industry||'').toLowerCase().includes(q))
  );
  document.getElementById('count-stocks').innerHTML = `Showing <span>${rows.length}</span> of <span>500</span> stocks`;
  document.getElementById('tc-s').textContent = rows.length<500?`(${rows.length})`:'';
  const tb = document.getElementById('tbody-stocks');
  if(!rows.length){tb.innerHTML='<tr><td colspan="6"><div class="empty">No results</div></td></tr>';return;}
  tb.innerHTML = rows.map(s => {
    const st = statsCache[s.ticker];
    return `<tr data-ticker="${esc(s.ticker)}" data-type="stock">
      <td><span class="ticker">${esc(s.ticker)}</span>${s.review?`<span class="review-dot" title="${esc(s.review)}"></span>`:''}</td>
      <td>${esc(s.name)}</td>
      <td><span class="tag">${esc(s.sector)}</span></td>
      <td style="font-size:13px">${esc(s.industry||'')}</td>
      <td style="font-family:monospace;font-size:13px">${st?fmtP(st.price):'<span class="no-data">—</span>'}</td>
      <td>${st?fmtR(st.ret):'<span class="no-data">—</span>'}</td>
    </tr>`;
  }).join('');
  attachRowClicks('tbody-stocks');
  if(!skipPreload) preload(rows.map(r=>r.ticker));
}

// ── Render ETFs ───────────────────────────────────────────────────────────────
function renderETFs(skipPreload) {
  const q = document.getElementById('search-etfs').value.toLowerCase().trim();
  const asset = document.getElementById('filter-asset').value;
  const geo = document.getElementById('filter-geo').value;
  const rows = DATA.etfs.filter(e =>
    (!asset||e.asset_class===asset) && (!geo||e.geography===geo) &&
    (!q||(e.ticker||'').toLowerCase().includes(q)||(e.name||'').toLowerCase().includes(q))
  );
  document.getElementById('count-etfs').innerHTML = `Showing <span>${rows.length}</span> of <span>100</span> ETFs`;
  document.getElementById('tc-e').textContent = rows.length<100?`(${rows.length})`:'';
  const tb = document.getElementById('tbody-etfs');
  if(!rows.length){tb.innerHTML='<tr><td colspan="7"><div class="empty">No results</div></td></tr>';return;}
  tb.innerHTML = rows.map(e => {
    const st = statsCache[e.ticker];
    const er = e.expense_ratio;
    return `<tr data-ticker="${esc(e.ticker)}" data-type="etf">
      <td><span class="ticker">${esc(e.ticker)}</span></td>
      <td>${esc(e.name)}</td>
      <td><span class="badge-eq">${esc(e.asset_class)}</span></td>
      <td style="font-size:13px">${esc(e.geography||'')}</td>

      <td>${st?fmtR(st.ret):'<span class="no-data">—</span>'}</td>
    </tr>`;
  }).join('');
  attachRowClicks('tbody-etfs');
  if(!skipPreload) preload(rows.map(r=>r.ticker));
}

function renderBonds() {
  const q = document.getElementById('search-bonds').value.toLowerCase().trim();
  const country = document.getElementById('filter-country').value;
  const status = document.getElementById('filter-bstatus').value;
  const rows = DATA.bonds.filter(b =>
    (!country||b.country===country) && (!status||b.status===status) &&
    (!q||(b.wins_code||'').toLowerCase().includes(q)||(b.full_name||'').toLowerCase().includes(q))
  );
  document.getElementById('count-bonds').innerHTML = `Showing <span>${rows.length}</span> of <span>60</span> bonds`;
  document.getElementById('tc-b').textContent = rows.length<60?`(${rows.length})`:'';
  const tb = document.getElementById('tbody-bonds');
  if(!rows.length){tb.innerHTML='<tr><td colspan="8"><div class="empty">No results</div></td></tr>';return;}
  tb.innerHTML = rows.map(b => `<tr>
    <td><span class="ticker" style="font-size:12px">${esc(b.wins_code)}</span></td>
    <td>${esc(b.country)}</td>

  </tr>`).join('');
}

// ── Row click delegation ──────────────────────────────────────────────────────
function attachRowClicks(tbodyId) {
  document.getElementById(tbodyId).addEventListener('click', e => {
    const tr = e.target.closest('tr[data-ticker]');
    if(!tr) return;
    openModal(tr.dataset.ticker, tr.dataset.type);
  }, {once:true});
  // re-attach after re-render by using event delegation on the static wrapper
  document.getElementById(tbodyId).onclick = e => {
    const tr = e.target.closest('tr[data-ticker]');
    if(tr) openModal(tr.dataset.ticker, tr.dataset.type);
  };
}

// ── Modal ─────────────────────────────────────────────────────────────────────
async function openModal(ticker, type) {
  const meta = type==='stock' ? SMETA[ticker] : EMETA[ticker];
  const name = meta ? (meta.name || '') : '';
  document.getElementById('m-ticker').textContent = ticker;
  document.getElementById('m-name').textContent = name;
  document.getElementById('m-stats').innerHTML = '';
  document.getElementById('m-meta').innerHTML = '';
  document.getElementById('m-loading').style.display = 'flex';
  document.getElementById('m-loading').textContent = 'Loading price data...';
  document.getElementById('m-chart').style.display = 'none';
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  if(chart){chart.destroy();chart=null;}
  currentRange = 365;
  document.querySelectorAll('.range-btn').forEach(b => b.classList.toggle('active', b.dataset.days==='365'));

  try {
    const res = await fetch('data/prices/' + ticker + '.json');
    if(!res.ok) throw new Error('no data');
    const prices = await res.json();
    if(!prices||prices.length<5) throw new Error('insufficient data');
    allPrices = prices;
    drawChart(prices, 365);
    buildStats(prices, type, meta);
  } catch(err) {
    document.getElementById('m-loading').textContent = 'No price data available for ' + ticker;
    if(meta) buildMeta(type, meta);
  }
}

function buildStats(prices, type, meta) {
  const last = prices[prices.length-1];
  const cut1y = new Date(Date.now()-365*86400000).toISOString().slice(0,10);
  const cut1w = new Date(Date.now()-7*86400000).toISOString().slice(0,10);
  const base1y = prices.find(p=>p.d>=cut1y)||prices[0];
  const base1w = prices.find(p=>p.d>=cut1w)||prices[prices.length-2]||prices[0];
  const ret1y = (last.c-base1y.c)/base1y.c*100;
  const ret1w = (last.c-base1w.c)/base1w.c*100;
  const recent = prices.slice(-252).map(p=>p.c);
  const hi52=Math.max(...recent), lo52=Math.min(...recent);
  const avgVol = prices.slice(-20).reduce((s,p)=>s+p.v,0)/20;
  const fmtVol = v => v>1e6?(v/1e6).toFixed(1)+'M':v>1e3?(v/1e3).toFixed(0)+'K':v.toFixed(0);
  const stats = [
    {l:'Price', v:fmtP(last.c)},
    {l:'1Y Return', v:(ret1y>=0?'+':'')+ret1y.toFixed(1)+'%', c:ret1y>=0?'pos':'neg'},
    {l:'1W Return', v:(ret1w>=0?'+':'')+ret1w.toFixed(1)+'%', c:ret1w>=0?'pos':'neg'},
    {l:'52W High', v:fmtP(hi52)},
    {l:'52W Low', v:fmtP(lo52)},
    {l:'Avg Vol (20d)', v:fmtVol(avgVol)},
  ];
  document.getElementById('m-stats').innerHTML = stats.map(s=>`
    <div class="stat-card">
      <div class="stat-label">${s.l}</div>
      <div class="stat-value ${s.c||''}">${s.v}</div>
    </div>`).join('');
  buildMeta(type, meta);
}

function buildMeta(type, meta) {
  if(!meta) return;
  const items = type==='stock'
    ? [['Sector',meta.sector],['Industry',meta.industry],['Sub-Industry',meta.sub_industry]]
    : [['Asset Class',meta.asset_class],['Strategy',meta.strategy],['Geography',meta.geography],
       ['Expense Ratio',meta.expense_ratio!=null?meta.expense_ratio+'%':null],['Actively Managed',meta.active]];
  document.getElementById('m-meta').innerHTML = items
    .filter(([,v])=>v!=null&&v!=='')
    .map(([k,v])=>`<div class="meta-row"><span>${esc(k)}</span><span>${esc(v)}</span></div>`)
    .join('');
}

function drawChart(prices, days) {
  const cutoff = new Date(Date.now()-days*86400000).toISOString().slice(0,10);
  const slice = prices.filter(p=>p.d>=cutoff);
  if(!slice.length) return;
  document.getElementById('m-loading').style.display='none';
  const canvas = document.getElementById('m-chart');
  canvas.style.display='block';
  if(chart){chart.destroy();}
  const closes = slice.map(p=>p.c);
  const up = closes[closes.length-1]>=closes[0];
  const color = up?'#3fb950':'#f85149';
  chart = new Chart(canvas, {
    type:'line',
    data:{
      labels: slice.map(p=>p.d),
      datasets:[{data:closes,borderColor:color,borderWidth:2,pointRadius:0,fill:true,
        backgroundColor:up?'rgba(63,185,80,0.07)':'rgba(248,81,73,0.07)',tension:0.2}]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{
        backgroundColor:'#1c2128',borderColor:'#30363d',borderWidth:1,
        titleColor:'#8b949e',bodyColor:'#e1e4e8',
        callbacks:{label:c=>' $'+c.raw.toFixed(2)}
      }},
      scales:{
        x:{grid:{color:'#21262d'},ticks:{color:'#484f58',maxTicksLimit:8,font:{size:11}},border:{color:'#30363d'}},
        y:{grid:{color:'#21262d'},ticks:{color:'#484f58',font:{size:11},callback:v=>'$'+v.toFixed(0)},border:{color:'#30363d'}}
      }
    }
  });
}

// Range buttons
document.querySelectorAll('.range-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const days = parseInt(btn.dataset.days);
    currentRange = days;
    document.querySelectorAll('.range-btn').forEach(b=>b.classList.toggle('active',b===btn));
    if(allPrices.length) drawChart(allPrices, days);
  });
});

// Close modal
document.getElementById('m-close').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', e => {
  if(e.target===document.getElementById('overlay')) closeModal();
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow='';
  if(chart){chart.destroy();chart=null;}
  allPrices=[];
}

// Init
renderStocks();
renderETFs();
renderBonds();
</script>
